<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeToken-Kai ダッシュボード</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap stack">

  <section class="card" id="engine">
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <div style="min-width:0">
        <div class="small muted" data-i18n="dash_model"></div>
        <div id="eng-model" style="font-weight:600;font-size:16px;word-break:break-all">—</div>
      </div>
      <span class="grow"></span>
      <div style="display:flex;gap:20px;align-items:flex-start">
        <div><div class="small muted" data-i18n="dash_state"></div><div id="eng-state">—</div></div>
        <div><div class="small muted" data-i18n="dash_uptime"></div><div id="eng-uptime">—</div></div>
      </div>
    </div>
    <div id="eng-load" hidden style="margin-top:10px">
      <div class="small muted" id="eng-load-l"></div>
      <div class="bar"><div id="eng-load-bar" style="width:0;background:var(--accent)"></div></div>
    </div>
    <div id="eng-msg" class="small" style="margin-top:6px" hidden></div>
  </section>

  <section class="grid g4">
    <div class="tile"><div class="l" data-i18n="dash_tile_gen"></div><div class="v"><span id="t-dec">—</span> <small>tok/s</small></div><div class="s" id="t-dec-s">&nbsp;</div></div>
    <div class="tile"><div class="l" data-i18n="dash_tile_prefill"></div><div class="v"><span id="t-pre">—</span> <small>tok/s</small></div><div class="s" id="t-pre-s">&nbsp;</div></div>
    <div class="tile"><div class="l" data-i18n="dash_tile_kv"></div><div class="v"><span id="t-kv">—</span> <small id="t-kv-tot"></small></div><div class="s" id="t-kv-s">&nbsp;</div></div>
    <div class="tile"><div class="l" data-i18n="dash_tile_req"></div><div class="v"><span id="t-req">—</span> <small data-i18n="dash_req_active"></small></div><div class="s" id="t-req-s">&nbsp;</div></div>
  </section>

  <section class="grid g2">
    <div class="card">
      <h2 data-i18n="dash_chart"></h2>
      <p class="hint" data-i18n="dash_chart_hint"></p>
      <canvas id="tps-chart" height="160"></canvas>
      <div class="legend"><span><span class="sw" style="background:var(--c-h2d)"></span><span data-i18n="dash_chart_gen"></span></span><span><span class="sw" style="background:var(--c-ssd)"></span><span data-i18n="dash_chart_prefill"></span></span></div>
    </div>
    <div class="card">
      <h2 data-i18n="dash_gpu"></h2>
      <p class="hint" id="gpu-hint"></p>
      <div id="gpus" class="stack"></div>
      <div class="legend one-line">
        <span><span class="sw" style="background:var(--c-weights)"></span><span data-i18n="dash_lg_weights"></span></span>
        <span><span class="sw" style="background:var(--c-kv)"></span><span data-i18n="dash_lg_kv"></span></span>
        <span><span class="sw" style="background:var(--c-moe)"></span><span data-i18n="dash_lg_moe"></span></span>
        <span><span class="sw" style="background:var(--c-mamba)"></span><span data-i18n="dash_lg_mamba"></span></span>
        <span id="lg-engine" hidden><span class="sw" style="background:var(--c-engine)"></span><span data-i18n="dash_lg_engine"></span></span>
        <span><span class="sw" style="background:var(--c-other)"></span><span data-i18n="dash_lg_other"></span></span>
      </div>
      <div id="ram" style="margin-top:14px"></div>
      <div class="legend" id="ram-legend" hidden>
        <span><span class="sw" style="background:var(--c-ram-used)"></span><span data-i18n="dash_lg_ram_used"></span></span>
        <span><span class="sw" style="background:var(--c-ram-cache)"></span><span data-i18n="dash_lg_ram_cache"></span></span>
        <span><span class="sw" style="background:var(--tile);box-shadow:inset 0 0 0 1px var(--line2)"></span><span data-i18n="dash_lg_ram_free"></span></span>
      </div>
    </div>
  </section>

  <section class="grid g2">
    <div class="card">
      <h2 data-i18n="dash_kai"></h2>
      <p class="hint" data-i18n="dash_kai_hint"></p>
      <div id="kai"></div>
    </div>
    <div class="card">
      <h2 data-i18n="dash_reqs"></h2>
      <div class="tablewrap"><table>
        <thead><tr><th data-i18n="dash_col_time"></th><th data-i18n="dash_col_api"></th><th class="num" data-i18n="dash_col_in"></th><th class="num" data-i18n="dash_col_out"></th><th class="num" data-i18n="dash_col_ttft"></th><th class="num" data-i18n="dash_col_total"></th><th class="num" data-i18n="dash_col_tps"></th></tr></thead>
        <tbody id="reqs"><tr><td colspan="7" class="muted" data-i18n="dash_reqs_none"></td></tr></tbody>
      </table></div>
    </div>
  </section>

  <section class="card" id="heat-card" hidden>
    <h2 data-i18n="heat_title"></h2>
    <p class="hint" data-i18n="heat_hint"></p>
    <div id="heat"></div>
  </section>

  <section class="grid g2" id="daemon-only" hidden>
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <h2 style="margin:0" data-i18n="dash_profiles"></h2><span class="grow"></span>
        <button id="btn-save-profile"></button>
      </div>
      <p class="hint" style="margin-top:4px" data-i18n="dash_profiles_hint"></p>
      <div id="profiles"></div>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px"><h2 style="margin:0" data-i18n="dash_log"></h2><span class="grow"></span><label class="small muted"><input type="checkbox" id="log-follow" checked> <span data-i18n="dash_log_follow"></span></label></div>
      <pre class="log" id="log" style="margin-top:8px"></pre>
    </div>
  </section>

</main>
<script src="i18n.js"></script>
<script src="suggest.js"></script>
<script src="heatmap.js"></script>
<script src="common.js"></script>
<script src="demo.js"></script>
<script src="profile-editor.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
